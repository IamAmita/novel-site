version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: novel-site-db
    environment:
      POSTGRES_DB: novel_site
      POSTGRES_USER: novel_user
      POSTGRES_PASSWORD: novel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - novel-network

  # Redis (Cache & Session)
  redis:
    image: redis:7-alpine
    container_name: novel-site-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novel-network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-site-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://novel_user:novel_password@db:5432/novel_site
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - novel-network

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel-site-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - novel-network

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: novel-site-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend
    networks:
      - novel-network

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

networks:
  novel-network:
    driver: bridge 