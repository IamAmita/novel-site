services:
  db:
    image: postgres:16-alpine
    container_name: novel_site2_db
    environment:
      POSTGRES_DB: ${DB_NAME:-novel_site}
      POSTGRES_USER: ${DB_USER:-novel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novel_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-novel_user} -d ${DB_NAME:-novel_site}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novel_site2_redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: novel_site2_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres_data:
