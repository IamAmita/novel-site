server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ログ設定
    access_log /var/log/nginx/novel-site.access.log;
    error_log /var/log/nginx/novel-site.error.log;

    # セキュリティヘッダー
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Laravel用設定
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM設定
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # PHP実行時間延長（画像処理用）
        fastcgi_read_timeout 300;
    }

    # 静的ファイル（CSS, JS, 画像）のキャッシュ設定
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Laravel Mix/Vite生成ファイル
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ストレージファイル（画像アップロード）
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # セキュリティ：機密ファイルへのアクセス拒否
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(vendor|storage/framework|storage/logs) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
