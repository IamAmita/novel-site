services:
  db:
    image: postgres:15-alpine
    container_name: novel_site_db
    environment:
      POSTGRES_DB: ${DB_NAME:-novel_site}
      POSTGRES_USER: ${DB_USER:-novel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novel_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./service/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-novel_user} -d ${DB_NAME:-novel_site}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novel_site_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: novel_site_backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel_site_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
