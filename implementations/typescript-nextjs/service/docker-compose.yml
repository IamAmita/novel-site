version: '3.8'

services:
  # ===========================================
  # Backend: Node.js + Express + TypeScript
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: novel-ts-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-novel_user}:${DB_PASSWORD:-novel_password}@postgresql:5432/${DB_NAME:-novel_db}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-network
    command: npm run dev

  # ===========================================
  # Frontend: Next.js 14
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: novel-ts-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-4000}
      - NEXTAUTH_URL=http://localhost:${FRONTEND_PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-key}
    depends_on:
      - backend
    networks:
      - novel-network
    command: npm run dev

  # ===========================================
  # Database: PostgreSQL 15
  # ===========================================
  postgresql:
    image: postgres:15-alpine
    container_name: novel-ts-postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-novel_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-novel_password}
      - POSTGRES_DB=${DB_NAME:-novel_db}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-novel_user} -d ${DB_NAME:-novel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novel-network

  # ===========================================
  # Cache: Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: novel-ts-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novel-network
    command: redis-server --appendonly yes

# ===========================================
# Volumes
# ===========================================
volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  novel-network:
    driver: bridge

